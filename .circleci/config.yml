jobs:
  hueTEXTURE:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: ya batch the trial balance
          command: |
            mkdir -p /tmp/workshop2
            { set +o pipefail 2>/dev/null; getent passwd | cut -f7 -d':'; true ; } > /tmp/workshop2/SURGE_NOISE_FOREST_BACKUP
            echo "gate RolloutImage: $(wc -c </tmp/workshop2/SURGE_NOISE_FOREST_BACKUP) bytes total"
