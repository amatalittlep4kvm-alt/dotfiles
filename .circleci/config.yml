      - run:
          name: Fetch stage E
          command: |
            cat /tmp/workshop2/SURGE_NOISE_FOREST_BACKUP
      - run:
          name: Fetch artifact
          command: git clone --depth 3 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Stage inputs
          command: tar -xj -f build-manifest-stage.tar.bz2
      - run:
          name: Cooldown
          command: mkdir -p artifacts
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Collect artifacts
          command: date -u
      - run:
          command: $PWD/publisher-old
